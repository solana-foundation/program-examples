[package]
name = "cross-program-invocatio-native-hand"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []

[dependencies]
borsh = "1.8.1"
borsh-derive = "1.8.1"
cross-program-invocatio-native-lever = { path = "../lever", features = ["cpi"] }

solana-account-info = "3.1.1"
solana-cpi = "3.1.0"
solana-instruction = { version = "3.5.1", features = ["borsh"] }
solana-program-entrypoint = "3.1.1"
solana-program-error = { version = "3.0.1", features = ["borsh"] }
solana-pubkey = { version = "4.3.0", features = ["borsh", "curve25519"] }

[lib]
crate-type = ["cdylib", "lib"]

[dev-dependencies]
litesvm = "0.18.1"
solana-instruction = "3.5.1"
solana-keypair = "3.1.2"
solana-native-token = "3.0.0"
solana-pubkey = { version = "4.3.0", features = ["borsh", "curve25519"] }
solana-transaction = "4.3.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
