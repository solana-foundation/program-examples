[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
pythexample = "GUkjQmrLPFXXNK1bFLKt8XQi6g3TjxcHVspbjDoHvMG2"

# [registry] section removed — no longer used in Anchor 1.0

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"
[scripts]
test = "mkdir -p tests/fixtures && [ -f tests/fixtures/sol_usd_price_update.bin ] || solana account 7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE -um --output-file tests/fixtures/sol_usd_price_update.bin; cargo test"
