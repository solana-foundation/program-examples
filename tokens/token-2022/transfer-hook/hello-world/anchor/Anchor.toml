[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
transfer_hook = "jY5DfVksJT8Le38LCaQhz5USeiGu4rUeVSS8QRAMoba"

# [registry] section removed — no longer used in Anchor 1.0

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm mocha --import=tsx -t 1000000 tests/**/*.ts"

# Transfer-hook tests use the real local validator.
# No external program clones needed — this project doesn't use Metaplex.
# The previous [[test.validator.clone]] of metaplex was unnecessary and
# caused 5-minute timeouts in CI trying to fetch from devnet.
