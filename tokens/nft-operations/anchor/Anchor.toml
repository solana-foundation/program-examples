[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.2"

[features]
seeds = false
skip-lint = false

[programs.localnet]
mint_nft = "3EMcczaGi9ivdLxvvFwRbGYeEUEHpGwabXegARw4jLxa"

[programs.devnet]
mint_nft = "3EMcczaGi9ivdLxvvFwRbGYeEUEHpGwabXegARw4jLxa"

