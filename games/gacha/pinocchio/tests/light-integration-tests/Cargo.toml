[package]
name = "light-tests-gacha"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Standalone workspace: light-program-test pins litesvm 0.7 / solana-sdk 2.3,
# which cannot share a dependency graph with the litesvm 0.12 / solana 3.x
# integration tests in the parent workspace.
[workspace]

[dev-dependencies]
gacha = { package = "gacha-program", path = "../../program", features = ["no-entrypoint"] }
light-program-test = "0.23.0"
light-client = "0.23.0"
light-sdk = "0.23.0"
solana-sdk = "2.3"
solana-system-interface = "1"
borsh = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
spl-token-2022 = "8.0"
spl-token-metadata-interface = "0.7"
