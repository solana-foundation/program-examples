[scripts]
test = "mkdir -p tests/fixtures && [ -f tests/fixtures/token_metadata.so ] || solana program dump -u m metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s tests/fixtures/token_metadata.so; cargo test"
