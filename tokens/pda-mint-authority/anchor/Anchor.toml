[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

[programs.localnet]
token_minter = "3LFrPHqwk5jMrmiz48BFj6NV2k4NjobgTe1jChzx3JGD"

# [registry] section removed — no longer used in Anchor 1.0

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Only run litesvm tests — the validator tests (test.ts) need Metaplex Token
# Metadata cloned from mainnet which is too slow/unreliable in CI.
# litesvm.test.ts uses a local fixture (tests/fixtures/token_metadata.so).
test = "pnpm mocha --import=tsx -t 1000000 tests/litesvm.test.ts"
