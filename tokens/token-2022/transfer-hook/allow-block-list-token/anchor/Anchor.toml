[toolchain]
anchor_version = "1.2.1"
solana_version = "4.3.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
abl-token = "EYBRvArz4kb5YLtzjD4TW6DbWhS8qjcMYqBU4wHLW3qj"

# [registry] section removed — no longer used in Anchor 1.0

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# cargo test runs both the tx_hook.rs unit tests and the litesvm
# integration test - CI's Anchor workflow only runs this [scripts] test
# command (never a separate `cargo test`), so without this the Rust-side
# tests were never actually executed.
test = "cargo test"
