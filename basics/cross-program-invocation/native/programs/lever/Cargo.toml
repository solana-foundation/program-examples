[package]
name = "cross-program-invocatio-native-lever"
version = "0.1.0"
edition = "2021"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []

[dependencies]
borsh = "1.8.1"
borsh-derive = "1.8.1"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }

solana-account-info = "3.1.1"
solana-cpi = "3.1.0"
solana-msg = "3.1.0"
solana-program-entrypoint = "3.1.1"
solana-program-error = { version = "3.0.1", features = ["borsh"] }
solana-pubkey = { version = "4.3.0", features = ["borsh", "curve25519"] }
solana-sysvar = "5.0.0"

[lib]
crate-type = ["cdylib", "lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
