[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.8"

[features]
seeds = false
skip-lint = false

[programs.localnet]
nft_staking = "gphHxoVFMHZXMfapWDGtCfQhX7cjmXYcFNn5mMnJTjJ"

[programs.devnet]
nft_staking = "gphHxoVFMHZXMfapWDGtCfQhX7cjmXYcFNn5mMnJTjJ"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Staking is time-based, and litesvm is the only harness here that can warp its
# clock — so the whole lifecycle (accrual, claiming, the freeze period) is
# covered there. Metaplex Token Metadata comes from a local fixture
# (tests/fixtures/token_metadata.so), dumped by prepare.mjs.
test = "pnpm mocha --import=tsx -t 1000000 tests/litesvm.test.ts"
