[package]
name = "merkle-tree-token-claimer"
version = "0.1.0"
description = "Merkle-proof token claimer for snapshot distributions and chain migrations"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "merkle_tree_token_claimer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"
sha2 = "0.10"

[dev-dependencies]
litesvm = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
solana-keypair = "3.1.2"
solana-message = "4.6.0"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
